name: Build NovaMotion 32-bit (armv7) APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  GGML_NATIVE: "OFF"

jobs:
  build-armv7:
    name: Build Android armv7 (32-bit)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Read version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' src/Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building NovaMotion $version for armv7-linux-androideabi"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1
          targets: armv7-linux-androideabi

      - name: Install cargo-apk
        uses: taiki-e/cache-cargo-install-action@v3
        with:
          tool: cargo-apk

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y cmake ninja-build libclang-dev clang pkg-config
          libclang_dir=$(find /usr/lib/llvm* /usr/lib/x86_64-linux-gnu -name "libclang.so*" 2>/dev/null | head -1 | xargs dirname)
          echo "Discovered LIBCLANG_PATH=$libclang_dir"
          echo "LIBCLANG_PATH=$libclang_dir" >> "$GITHUB_ENV"

      - name: Build FFmpeg 32-bit for Android
        run: src/scripts/ffmpeg-mobile.sh armv7-linux-androideabi

      - name: Fetch sherpa-onnx 32-bit for Android
        run: src/scripts/sherpa-mobile.sh armv7-linux-androideabi

      - name: Generate release keystore
        run: |
          keystore=$RUNNER_TEMP/run.keystore
          keytool -genkeypair -v -keystore "$keystore" -storepass concat -keypass concat \
            -alias concat -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=NovaMotion, O=NovaMotion" >/dev/null 2>&1
          echo "CARGO_APK_RELEASE_KEYSTORE=$keystore" >> "$GITHUB_ENV"
          echo "CARGO_APK_RELEASE_KEYSTORE_PASSWORD=concat" >> "$GITHUB_ENV"

      - name: Build NovaMotion APK
        working-directory: src
        run: |
          set -euo pipefail
          eval "$(scripts/mobile-env.sh armv7-linux-androideabi)"
          if [ -z "${LIBCLANG_PATH:-}" ]; then
            export LIBCLANG_PATH=$(find /usr/lib/llvm* /usr/lib/x86_64-linux-gnu -name "libclang.so*" 2>/dev/null | head -1 | xargs dirname)
          fi
          echo "Using LIBCLANG_PATH: $LIBCLANG_PATH"
          cargo apk build --release -p concat-android --target armv7-linux-androideabi

      - name: Stage APK
        run: |
          mkdir -p output
          version="${{ steps.version.outputs.version }}"
          find src/target -name "*.apk" -ls
          apk_file=$(find src/target -name "NovaMotion.apk" -o -name "Concat.apk" -o -name "*.apk" | grep -v "unaligned" | head -1)
          echo "Found APK at $apk_file"
          cp "$apk_file" "output/NovaMotion-${version}-android-armv7.apk"
          ls -lh output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: NovaMotion-android-armv7-apk
          path: output/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v${{ steps.version.outputs.version }}-novamotion
          name: NovaMotion v${{ steps.version.outputs.version }} (armv7 32-bit)
          body: |
            ### 🚀 NovaMotion v${{ steps.version.outputs.version }}
            **Alight Motion Aesthetic + Performance Edition**
            - **Architecture:** Android 32-bit (`armv7-linux-androideabi`) - Optimized for budget devices (Vivo Y15s, Helio P35, 3GB RAM)
            - **Theme:** Dark Carbon (`#0D1117`) + Electric Blue (`#0084FF`) & Cyber Cyan (`#00D2FF`)
            - **Gallery:** Instant direct MediaStore path resolution (zero duplicate copying into internal storage)
            - **Speech AI:** Groq Cloud Whisper Turbo (`whisper-large-v3-turbo` on LPUs) for instant <1s captions with 0% CPU strain
          files: output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
